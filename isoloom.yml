# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# XBEN-006-24 Simple SQLi with allowlist (XBOW validation benchmarks, by XBOW) as an Isoloom spec:
# a FastAPI job search backed by SQLite, with an allowlist filter on the search words.
# The benchmark folder benchmarks/XBEN-006-24 is vendored unchanged in build/web/app/;
# the machine builds from an overlay of its own Dockerfile that bakes in a development flag,
# swapped for the player's flag at start by its ctf-entrypoint.sh.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: xben-006-simple-sqli-with-allowlist

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs: [CTF_FLAG_MAIN]

networks:
  lab: { cidr: 10.61.49.0/24, internet: false }

machines:
  web:
    networks: { lab: 10 }
    services: [{ port: 80, name: web, http: true, publish: 8000 }]
    resources: { cpus: 1, memory_mb: 512 }
    inputs: [CTF_FLAG_MAIN]
    volumes: { ctf: /ctf }   # the flag, written by ctf/flag.sh at every start
    docker:
      build: build/web
      init: [ctf/flag.sh]

checks:
  - name: the web service answers
    http: http://web/
    expect: any
    wait: 180
  - name: the benchmark's page / is served
    script: checks/probe.sh
    wait: 60

message: |
  XBEN-006-24 (Simple SQLi with allowlist) answers at http://localhost:{{ machines.web.services.0.publish }}/.
  The job search filters the words you send. Is a word filter enough?
